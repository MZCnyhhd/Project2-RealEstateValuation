<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>后台登录 - 全息估值</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh;
               display: flex; align-items: center; justify-content: center; }
        .login-card { width: 100%; max-width: 380px; border: none; border-radius: 1rem; }
    </style>
</head>
<body>
    <div class="card login-card shadow-lg">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <i class="bi bi-shield-lock fs-1" style="color:#667eea;"></i>
                <h5 class="mt-2 mb-0 fw-bold">商家后台登录</h5>
                <small class="text-muted">全息估值 · 收款核验</small>
            </div>
            {% if error %}
            <div class="alert alert-danger small py-2" role="alert">
                <i class="bi bi-exclamation-triangle me-1"></i>{{ error }}
            </div>
            {% endif %}
            <form method="POST" action="/admin/login">
                <div class="mb-3">
                    <label class="form-label small text-muted">管理密码</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-key"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="请输入后台密码" required autofocus>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-bold">
                    <i class="bi bi-box-arrow-in-right me-1"></i>登录
                </button>
            </form>
        </div>
    </div>
</body>
</html>
