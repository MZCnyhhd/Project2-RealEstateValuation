<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>全息估值 - 录入房源信息</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .form-section { border-left: 3px solid #667eea; padding-left: 1rem; margin-bottom: 1.5rem; }
        .form-section h6 { color: #667eea; font-weight: 700; margin-bottom: .75rem; }
        .hero-banner { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; padding: 2.5rem 0; margin-bottom: 2rem; }
        .price-tag { font-size: .85rem; background: rgba(255,255,255,.15); padding: .25rem .75rem; border-radius: 1rem; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="bi bi-gem"></i> 全息估值</a>
            <div class="ms-auto d-flex gap-2">
                <a class="btn btn-warning btn-sm fw-bold" href="/valuate"><i class="bi bi-gem"></i> 全息估值</a>
                <a class="btn btn-outline-light btn-sm" href="/calculator"><i class="bi bi-calculator"></i> 计算器</a>
                <a class="btn btn-outline-light btn-sm" href="/listings"><i class="bi bi-house"></i> 房源</a>
            </div>
        </div>
    </nav>

    <div class="hero-banner">
        <div class="container">
            <h2><i class="bi bi-gem me-2"></i>房地产全息价值评估</h2>
            <p class="mb-2 opacity-90">7层 × 182维度，AI驱动的房产估值引擎。填写房源信息，生成专业估值报告。</p>
            <div class="d-flex gap-3 flex-wrap">
                <span class="price-tag"><i class="bi bi-check-circle me-1"></i>免费预览：综合评分 + 估值结论</span>
                <span class="price-tag"><i class="bi bi-lock me-1"></i>完整报告：182维度逐项分析 ¥9.9</span>
            </div>
        </div>
    </div>

    <div class="container pb-5">
        <form action="/valuate/report" method="POST" id="valuateForm">
            <div class="row">
                <div class="col-lg-8">
                    <!-- 基本信息 -->
                    <div class="card shadow-sm mb-4">
                        <div class="card-body">
                            <div class="form-section">
                                <h6><i class="bi bi-building me-1"></i>基本信息</h6>
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label">小区名称 <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" name="community" required placeholder="如：金茂府">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">详细地址</label>
                                        <input type="text" class="form-control" name="address" placeholder="如：朝阳区花园路96号院">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">建筑面积(㎡) <span class="text-danger">*</span></label>
                                        <input type="number" step="0.1" class="form-control" name="area_size" required placeholder="如：89.5">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">报价/挂牌价(万) <span class="text-danger">*</span></label>
                                        <input type="number" step="1" class="form-control" name="price" required placeholder="如：520">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">建筑年代</label>
                                        <input type="number" class="form-control" name="build_year" placeholder="如：2018" min="1950" max="2026">
                                    </div>
                                </div>
                            </div>

                            <div class="form-section">
                                <h6><i class="bi bi-door-open me-1"></i>房屋属性</h6>
                                <div class="row g-3">
                                    <div class="col-md-2">
                                        <label class="form-label">室</label>
                                        <input type="number" class="form-control" name="layout_rooms" value="3" min="0" max="10">
                                    </div>
                                    <div class="col-md-2">
                                        <label class="form-label">厅</label>
                                        <input type="number" class="form-control" name="layout_halls" value="2" min="0" max="5">
                                    </div>
                                    <div class="col-md-2">
                                        <label class="form-label">卫</label>
                                        <input type="number" class="form-control" name="layout_baths" value="1" min="0" max="5">
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label">所在楼层</label>
                                        <input type="number" class="form-control" name="floor" placeholder="如：12">
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label">总楼层</label>
                                        <input type="number" class="form-control" name="total_floors" placeholder="如：28">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">朝向</label>
                                        <select class="form-select" name="orientation">
                                            <option value="南">南</option>
                                            <option value="东南">东南</option>
                                            <option value="西南">西南</option>
                                            <option value="东">东</option>
                                            <option value="西">西</option>
                                            <option value="北">北</option>
                                        </select>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">装修状况</label>
                                        <select class="form-select" name="decoration">
                                            <option value="毛坯">毛坯</option>
                                            <option value="简装">简装</option>
                                            <option value="精装" selected>精装</option>
                                            <option value="豪装">豪装</option>
                                        </select>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">梯户比</label>
                                        <select class="form-select" name="elevator_ratio">
                                            <option value="1T2">1梯2户</option>
                                            <option value="2T4" selected>2梯4户</option>
                                            <option value="2T6">2梯6户</option>
                                            <option value="3T8">3梯8户</option>
                                        </select>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">层高(米)</label>
                                        <input type="number" step="0.1" class="form-control" name="ceiling_height" placeholder="如：2.9" value="2.8">
                                    </div>
                                    <div class="col-12">
                                        <div class="d-flex flex-wrap gap-3">
                                            <div class="form-check"><input class="form-check-input" type="checkbox" name="north_south" value="1" id="ck_ns"><label class="form-check-label" for="ck_ns">南北通透</label></div>
                                            <div class="form-check"><input class="form-check-input" type="checkbox" name="has_elevator" value="1" id="ck_ev" checked><label class="form-check-label" for="ck_ev">有电梯</label></div>
                                            <div class="form-check"><input class="form-check-input" type="checkbox" name="squareness" value="1" id="ck_sq" checked><label class="form-check-label" for="ck_sq">户型方正</label></div>
                                            <div class="form-check"><input class="form-check-input" type="checkbox" name="dry_wet_sep" value="1" id="ck_dw"><label class="form-check-label" for="ck_dw">干湿分离</label></div>
                                            <div class="form-check"><input class="form-check-input" type="checkbox" name="bright_bath" value="1" id="ck_bb"><label class="form-check-label" for="ck_bb">明卫(有窗)</label></div>
                                            <div class="form-check"><input class="form-check-input" type="checkbox" name="has_central_ac" value="1" id="ck_ac"><label class="form-check-label" for="ck_ac">中央空调</label></div>
                                            <div class="form-check"><input class="form-check-input" type="checkbox" name="has_fresh_air" value="1" id="ck_fa"><label class="form-check-label" for="ck_fa">新风系统</label></div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="form-section">
                                <h6><i class="bi bi-houses me-1"></i>小区信息</h6>
                                <div class="row g-3">
                                    <div class="col-md-3">
                                        <label class="form-label">容积率</label>
                                        <input type="number" step="0.1" class="form-control" name="far" placeholder="如：2.5">
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label">绿化率(%)</label>
                                        <input type="number" class="form-control" name="green_rate" placeholder="如：35">
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label">物业费(元/㎡/月)</label>
                                        <input type="number" step="0.1" class="form-control" name="property_fee" placeholder="如：3.5">
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label">车位配比</label>
                                        <input type="number" step="0.1" class="form-control" name="parking_ratio" placeholder="如：1.2">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">物业/开发商品牌</label>
                                        <select class="form-select" name="property_brand">
                                            <option value="">请选择</option>
                                            <option value="万科">万科</option>
                                            <option value="龙湖">龙湖</option>
                                            <option value="绿城">绿城</option>
                                            <option value="中海">中海</option>
                                            <option value="保利">保利</option>
                                            <option value="华润">华润</option>
                                            <option value="普通">普通物业</option>
                                        </select>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">总户数</label>
                                        <input type="number" class="form-control" name="total_units" placeholder="如：800">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">楼间距(米)</label>
                                        <input type="number" class="form-control" name="building_gap" placeholder="如：45">
                                    </div>
                                    <div class="col-12">
                                        <div class="form-check"><input class="form-check-input" type="checkbox" name="ped_car_split" value="1" id="ck_pc"><label class="form-check-label" for="ck_pc">人车分流</label></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-4">
                    <!-- 周边配套 -->
                    <div class="card shadow-sm mb-4">
                        <div class="card-body">
                            <div class="form-section">
                                <h6><i class="bi bi-geo-alt me-1"></i>周边配套</h6>
                                <div class="row g-3">
                                    <div class="col-12">
                                        <label class="form-label">距最近地铁站(米)</label>
                                        <input type="number" class="form-control" name="subway_distance" placeholder="如：500">
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label">距CBD通勤(分钟)</label>
                                        <input type="number" class="form-control" name="cbd_commute" placeholder="如：35">
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label">对口学校等级</label>
                                        <select class="form-select" name="school_level">
                                            <option value="">无/不确定</option>
                                            <option value="市重点">市重点</option>
                                            <option value="区重点">区重点</option>
                                            <option value="普通">普通学校</option>
                                        </select>
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label">距三甲医院(分钟车程)</label>
                                        <input type="number" class="form-control" name="hospital_min" placeholder="如：15">
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label">距最近公园(米)</label>
                                        <input type="number" class="form-control" name="park_distance" placeholder="如：800">
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label">距大型商超(米)</label>
                                        <input type="number" class="form-control" name="mall_distance" placeholder="如：1200">
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label">噪音环境</label>
                                        <select class="form-select" name="noise_level">
                                            <option value="安静">安静</option>
                                            <option value="一般" selected>一般</option>
                                            <option value="临街">临街</option>
                                            <option value="临高架">临高架/铁路</option>
                                        </select>
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label">窗外景观</label>
                                        <select class="form-select" name="view_type">
                                            <option value="无遮挡">无遮挡(开阔)</option>
                                            <option value="公园景">公园/绿化景</option>
                                            <option value="湖景">湖景/水景</option>
                                            <option value="城市景">城市景观</option>
                                            <option value="楼对楼">楼对楼(遮挡)</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 特殊与交易 -->
                    <div class="card shadow-sm mb-4">
                        <div class="card-body">
                            <div class="form-section">
                                <h6><i class="bi bi-shield-exclamation me-1"></i>产权与交易</h6>
                                <div class="row g-3">
                                    <div class="col-12">
                                        <label class="form-label">产权类型</label>
                                        <select class="form-select" name="property_type">
                                            <option value="商品房" selected>商品房</option>
                                            <option value="已购公房">已购公房(房改房)</option>
                                            <option value="经适房">经济适用房</option>
                                            <option value="共有产权">共有产权房</option>
                                            <option value="商住两用">商住两用</option>
                                        </select>
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label">挂牌天数</label>
                                        <input type="number" class="form-control" name="listing_days" placeholder="如：45">
                                    </div>
                                    <div class="col-12">
                                        <div class="d-flex flex-wrap gap-2">
                                            <div class="form-check"><input class="form-check-input" type="checkbox" name="five_year_only" value="1" id="ck_5y"><label class="form-check-label" for="ck_5y">满五唯一</label></div>
                                            <div class="form-check"><input class="form-check-input" type="checkbox" name="has_mortgage" value="1" id="ck_mg"><label class="form-check-label" for="ck_mg">有抵押</label></div>
                                            <div class="form-check"><input class="form-check-input" type="checkbox" name="has_lease" value="1" id="ck_ls"><label class="form-check-label" for="ck_ls">有租约</label></div>
                                            <div class="form-check"><input class="form-check-input" type="checkbox" name="urgent_sell" value="1" id="ck_us"><label class="form-check-label" for="ck_us">急售</label></div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="form-section mt-3">
                                <h6><i class="bi bi-exclamation-triangle me-1"></i>特殊情况(选填)</h6>
                                <div class="row g-3">
                                    <div class="col-12">
                                        <div class="d-flex flex-wrap gap-2">
                                            <div class="form-check"><input class="form-check-input" type="checkbox" name="is_haunted" value="1" id="ck_ht"><label class="form-check-label" for="ck_ht">凶宅</label></div>
                                            <div class="form-check"><input class="form-check-input" type="checkbox" name="has_leak" value="1" id="ck_lk"><label class="form-check-label" for="ck_lk">有漏水</label></div>
                                            <div class="form-check"><input class="form-check-input" type="checkbox" name="door_toilet" value="1" id="ck_dt"><label class="form-check-label" for="ck_dt">入门见厕</label></div>
                                            <div class="form-check"><input class="form-check-input" type="checkbox" name="beam_press" value="1" id="ck_bp"><label class="form-check-label" for="ck_bp">横梁压顶</label></div>
                                        </div>
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label">周边忌讳设施</label>
                                        <select class="form-select" name="taboo_facilities">
                                            <option value="">无</option>
                                            <option value="殡仪馆">殡仪馆/火葬场</option>
                                            <option value="墓地">墓地/陵园</option>
                                            <option value="变电站">变电站/高压线</option>
                                            <option value="垃圾站">垃圾中转站</option>
                                            <option value="加油站">加油站/化工厂</option>
                                        </select>
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label">风水问题</label>
                                        <select class="form-select" name="feng_shui_issue">
                                            <option value="">无</option>
                                            <option value="路冲">路冲(路直冲大门)</option>
                                            <option value="反弓路">反弓路</option>
                                            <option value="天斩煞">天斩煞(两楼缝隙正对)</option>
                                        </select>
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label">供暖方式</label>
                                        <select class="form-select" name="heating_type">
                                            <option value="集中供暖">集中供暖</option>
                                            <option value="地暖">地暖</option>
                                            <option value="自采暖">自采暖</option>
                                            <option value="无">无供暖</option>
                                        </select>
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label">窗户类型</label>
                                        <select class="form-select" name="window_type">
                                            <option value="断桥铝">断桥铝(双层中空)</option>
                                            <option value="塑钢">塑钢</option>
                                            <option value="铝合金">铝合金(单层)</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 提交 -->
                    <div class="card shadow-sm border-0" style="background:linear-gradient(135deg,#667eea,#764ba2);">
                        <div class="card-body text-center text-white">
                            <p class="mb-2 small opacity-75">填写越完整，估值越精准（当前支持182个评估维度）</p>
                            <button type="submit" class="btn btn-light btn-lg fw-bold px-5">
                                <i class="bi bi-graph-up-arrow me-2"></i>生成估值报告
                            </button>
                            <p class="mb-0 mt-2 small opacity-75">免费查看评分与结论 · 完整报告 ¥9.9</p>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <footer class="py-4 bg-light">
        <div class="container text-center text-muted">
            <p class="mb-0">&copy; 2026 房地产智能Agent · 全息估值引擎 v1.0</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
