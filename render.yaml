services:
  - type: web
    name: realestate-flask-demo
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:application --bind 0.0.0.0:$PORT
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATA_BACKEND
        value: json
      # 后台管理密码（人工核验收款后台 /admin 登录口令，必填，请设置强密码）
      - key: ADMIN_PASSWORD
        sync: false
      # 微信支付 v3（留空则支付页回退到演示模式）
      - key: WXPAY_MCH_ID
        sync: false
      - key: WXPAY_APP_ID
        sync: false
      - key: WXPAY_API_V3_KEY
        sync: false
      - key: WXPAY_MCH_SERIAL
        sync: false
      - key: WXPAY_PRIVATE_KEY
        sync: false
      # 套餐价格（可选，留空则用默认价：标准 9.9 / 专业版 49 / 深度实勘 99）
      - key: PRICE_STANDARD
        sync: false
      - key: PRICE_PRO
        sync: false
      - key: PRICE_PRO_PLUS
        sync: false
      # 订单存储后端：json（默认，Render 临时盘会清）或 sqlite（需挂载持久磁盘才真正持久）
      - key: ORDERS_BACKEND
        sync: false
      # 北京市公共数据开放平台 API 唯一标识码（行情基准数据自动刷新；不填则用仓库内置 CSV）
      - key: BJ_DATA_USERKEY
        sync: false
      # 小米 MiMo 开放平台 API Key（全项目唯一 LLM：智能客服对话 / 房贷参数提取 / 截图视觉解析）
      # 获取：https://mimo.mi.com ；模型默认 mimo-v2.5，接口 https://api.xiaomimimo.com/v1
      - key: MIMO_API_KEY
        sync: false
      - key: MIMO_MODEL
        sync: false
